# AI问答系统完整测试用例
# 包含基础功能测试和高级业务场景测试

# ========== 基础功能测试 ==========

# 基础统计查询测试
- q: "海曙区总共有多少条事件记录？"
  expect_contains: ["5810", "条", "记录"]
  category: "基础统计"

- q: "三级事件有多少条？"
  expect_contains: ["三级", "事件"]
  category: "基础统计"

- q: "二级事件的数量"
  expect_contains: ["二级", "事件"]
  category: "基础统计"

# 条件筛选查询测试
- q: "6月5日月湖街道的三级事件数量"
  expect_contains: ["6月5日", "月湖街道", "三级", "7"]
  category: "条件筛选"

- q: "6月5日的事件有多少条？"
  expect_contains: ["6月5日", "232"]
  category: "条件筛选"

- q: "古林镇的事件数量"
  expect_contains: ["古林镇", "675"]
  category: "条件筛选"

# 排名和对比查询测试
- q: "按镇街统计事件数量前5名"
  expect_contains: ["镇街", "排名", "集士港镇"]
  category: "排名对比"

- q: "按镇街统计事件数量前3名"
  expect_contains: ["集士港镇", "高桥镇", "古林镇"]
  category: "排名对比"

- q: "事件数量最多的街道是哪个？"
  expect_contains: ["集士港镇", "805"]
  category: "排名对比"

# 时间相关查询测试
- q: "平均办理时长是多少？"
  expect_contains: ["平均", "时长", "分钟"]
  category: "时间分析"

- q: "数据的时间范围是什么？"
  expect_contains: ["2025年", "时间范围"]
  category: "时间分析"

# 分类统计查询测试
- q: "消费纠纷类型的事件数量"
  expect_contains: ["消费纠纷", "事件"]
  category: "分类统计"

- q: "矛盾纠纷类事件有多少条？"
  expect_contains: ["矛盾纠纷", "事件"]
  category: "分类统计"

- q: "债务纠纷类型的事件统计"
  expect_contains: ["债务纠纷", "事件"]
  category: "分类统计"

# 文本搜索测试
- q: "包含退款的事件案例"
  expect_contains: ["退款", "事件"]
  category: "文本搜索"

- q: "涉及噪音的事件"
  expect_contains: ["噪音", "事件"]
  category: "文本搜索"

- q: "关于房屋租赁的案例"
  expect_contains: ["租赁", "事件"]
  category: "文本搜索"

- q: "包含纠纷的事件描述"
  expect_contains: ["纠纷", "事件"]
  category: "文本搜索"

# 复杂查询测试
- q: "月湖街道和古林镇的事件数量对比"
  expect_contains: ["月湖街道", "古林镇", "事件数量"]
  category: "复杂查询"

- q: "三级事件的平均办理时长"
  expect_contains: ["三级事件", "平均", "时长"]
  category: "复杂查询"

- q: "6月份的事件趋势"
  expect_contains: ["6月", "事件", "趋势"]
  category: "复杂查询"

# 地理分布查询测试
- q: "哪些街道的事件数量超过500条？"
  expect_contains: ["街道", "事件数量", "超过"]
  category: "地理分布"

- q: "望春街道的事件级别分布"
  expect_contains: ["望春街道", "事件级别", "分布"]
  category: "地理分布"

# 错误处理测试
- q: "不存在的街道的事件数量"
  expect_contains: ["0", "件"]
  category: "错误处理"

- q: "无效日期的事件查询"
  expect_contains: ["无效", "日期"]
  category: "错误处理"

# ========== 高级业务场景测试 ==========

# 具体事件查询
- q: "事件编号为 YHW202505060301 的事件发生在哪个镇街？请给出事件描述。"
  expect_contains: ["YHW202505060301"]
  category: "具体事件"

- q: "5 月 6 日发生在月湖街道的事件有几起？"
  expect_contains: ["月湖街道", "起"]
  category: "具体事件"

- q: "5 月 6 日在月湖街道且事件级别为三级的消费纠纷有哪些？列出事件编号。"
  expect_contains: ["月湖街道", "消费纠纷"]
  category: "具体事件"

# 统计分析查询
- q: "按照 二级分类 统计，本月各类纠纷数量排名前五是？"
  expect_contains: ["排名", "二级分类"]
  category: "统计分析"

- q: "按镇街和二级分类交叉统计件数，列出月湖街道 TOP 3 类别。"
  expect_contains: ["月湖街道", "TOP"]
  category: "统计分析"

# 时间序列分析
- q: "5 月份每天上报的事件量曲线是怎样的？"
  expect_contains: ["日期", "上报"]
  category: "时间序列"

- q: "5 月份哪个具体时段（日期＋小时）上报量最高？"
  expect_contains: ["上报", "最高"]
  category: "时间序列"

# 办理时效分析
- q: "本月事件从'上报时间'到'办结时间'平均耗时多久？"
  expect_contains: ["平均", "耗时"]
  category: "时效分析"

- q: "哪一件事件的办理用时最长？请给出编号、镇街和耗时。"
  expect_contains: ["耗时", "最长"]
  category: "时效分析"

# 事件状态查询
- q: "截至今天还有多少事件状态不是'已办结'？"
  expect_contains: ["未办结"]
  category: "状态查询"

- q: "'二级事件'中，受理时间超过24 小时才办结的有哪些？"
  expect_contains: ["超过"]
  category: "状态查询"

# 文本内容搜索
- q: "描述里包含'退钱'或'退款'的事件都有哪些？列出事件编号和镇街。"
  expect_contains: ["退"]
  category: "高级文本搜索"

- q: "处置结果中提到身份证号码的事件数量？"
  expect_contains: ["身份证"]
  category: "高级文本搜索"

# 地区专项分析
- q: "古林镇 5 月份的消费纠纷件数是多少？占全区消费纠纷的百分比？"
  expect_contains: ["古林镇", "消费纠纷"]
  category: "地区专项"

- q: "白云街道内哪个村社上报量最多？数量是多少？"
  expect_contains: ["白云街道", "村社"]
  category: "地区专项"

# 分类字段分析
- q: "四条跑道字段标为'平安法治'的事件共多少起？其中三级事件占比？"
  expect_contains: ["平安法治"]
  category: "字段分析"

- q: "标注类型中'矛盾纠纷'之外的其他类型有哪些，各自件数？"
  expect_contains: ["矛盾纠纷"]
  category: "字段分析"

# 职能部门分析
- q: "办结职能科室为'非警务协同处置'的事件平均耗时多少？"
  expect_contains: ["非警务协同处置"]
  category: "部门分析"

# 上报人分析
- q: "上报人 yh9927a 上报了多少事件？覆盖几个镇街？"
  expect_contains: ["yh9927a"]
  category: "人员分析"

# 数据质量检查
- q: "'网格名称'为空或缺失的记录有几条？请列出前 5 条编号。"
  expect_contains: ["网格名称"]
  category: "数据质量"

- q: "'村社名称'与'网格名称'相同的情况占比？"
  expect_contains: ["相同"]
  category: "数据质量"

# 数据一致性检查
- q: "是否存在'一级事件'却被标记为'消费纠纷'的记录？如有请列举。"
  expect_contains: ["一级事件", "消费纠纷"]
  category: "一致性检查"

- q: "数据来源含'全量矛调'但四条跑道不是'平安法治'的有多少条？"
  expect_contains: ["全量矛调"]
  category: "一致性检查"

# 月度对比分析
- q: "相比 4 月份，5 月份总事件量增长了多少百分比？"
  expect_contains: ["百分比"]
  category: "对比分析"

- q: "5 月与 4 月'邻里纠纷'件数变化率是多少？"
  expect_contains: ["邻里纠纷"]
  category: "对比分析"

# 特定日期深度分析
- q: "5 月 6 日海曙区上报的所有'邻里纠纷'事件有哪些？"
  expect_contains: ["海曙区", "邻里纠纷"]
  category: "深度分析"

- q: "其中耗时超过 12 小时才受理的有吗？"
  expect_contains: ["耗时"]
  category: "深度分析"

- q: "把这些事件的处置结果发给我，按耗时降序。"
  expect_contains: ["处置结果"]
  category: "深度分析"

# 对比分析
- q: "请比较月湖街道与白云街道在'消费纠纷'上的平均办理时长，并给出差异原因的初步分析"
  expect_contains: ["月湖街道", "白云街道"]
  category: "高级对比"

# 中位数统计
- q: "处置结果包含'协调'两字的事件，其办理时长中位数是多少？"
  expect_contains: ["协调"]
  category: "统计分析"

# 问题总结分析
- q: "基于处置结果字段，总结本月群众反映最集中的前三类问题。"
  expect_contains: ["群众"]
  category: "总结分析"

- q: "归纳本月处置结果中体现'调解成功'的典型做法，列出 3 条案例摘要。"
  expect_contains: ["调解成功"]
  category: "总结分析"

# 数据异常检查
- q: "有没有上报时间晚于最后受理时间的记录？数量是多少？"
  expect_contains: ["上报时间"]
  category: "异常检查"

- q: "事件级别字段为空但已办结的情况有几条？"
  expect_contains: ["已办结"]
  category: "异常检查"

# 模板化查询
- q: "我想查看本月{镇街}的{二级分类}事件数量。"
  expect_contains: ["事件数量"]
  category: "模板查询"

- q: "最近有没有关于'停车纠纷'的案例？"
  expect_contains: ["停车纠纷"]
  category: "模板查询"

# 排行榜查询
- q: "请给我列出办结耗时最长的前 10 条记录（编号、镇街、耗时）。"
  expect_contains: ["耗时", "前 10"]
  category: "排行榜"

# 比例计算
- q: "三级事件占所有事件的比例是多少？保留两位小数。"
  expect_contains: ["比例"]
  category: "比例计算"

# 满意度分析
- q: "处置结果里包含'满意'或'谢谢'的记录有几条？"
  expect_contains: ["满意", "谢谢"]
  category: "满意度"

# 复合条件查询
- q: "找出村社名称中带'社区'且事件级别≥二级、二级分类为'债务纠纷'的事件，计算平均、最小、最大办理时长，并给出办理最慢那条的处置结果。"
  expect_contains: ["债务纠纷"]
  category: "复合条件" 